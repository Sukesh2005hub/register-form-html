<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/128/10040/10040617.png">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        .gender {
            width: auto;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #217dbb;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Registration Form</h1>

        <form>

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter phone number"
            >

            <label>Gender</label>

            <input
                class="gender"
                type="radio"
                name="gender"
                value="male"
            >
            Male

            <input
                class="gender"
                type="radio"
                name="gender"
                value="female"
            >
            Female

            <input
                class="gender"
                type="radio"
                name="gender"
                value="other"
            >
            Other


            <label for="course">Select Course</label>

            <select id="course" name="course">
                <option value="">-- Select Course --</option>
                <option value="java">Java Full Stack</option>
                <option value="python">Python</option>
                <option value="web">Web Development</option>
            </select>


            <label for="message">Address</label>

            <textarea
                id="message"
                name="address"
                rows="4"
                placeholder="Enter your address"
            ></textarea>


            <button type="submit">
                Register
            </button>

        </form>

    </div>

</body>
</html>
